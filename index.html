<html lang="fr">

<style>
:root{
  --papier:#FBF3E2;   /* crème solaire */
  --encre:#23324A;    /* bleu nuit pyrénéen */
  --soleil:#FFB800;   /* jaune Yelloh */
  --gave:#1E7F86;     /* turquoise torrent */
  --sapin:#2E7D4F;
  --braise:#E4572E;
  --craie:#FFFFFF;
  --scotch:rgba(222,196,138,.75);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--papier);color:var(--encre);line-height:1.45;padding-bottom:84px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:3px solid var(--braise);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- entête fanion ---- */
header{position:sticky;top:0;z-index:50;background:var(--encre);color:var(--craie);padding:10px 14px;box-shadow:0 2px 10px rgba(35,50,74,.35)}
.h-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between}
.h-t{font-weight:800;font-size:18px;letter-spacing:.3px}
.h-s{font-size:12px;opacity:.85}
.badge-sync{font-size:11px;font-family:var(--mono);padding:4px 8px;border-radius:999px;background:#39506F;white-space:nowrap}
.badge-sync.ok{background:var(--sapin)}
.badge-sync.off{background:var(--braise)}
.score{max-width:760px;margin:6px auto 0;display:flex;align-items:center;gap:8px;font-size:12px}
.score .bar{flex:1;height:8px;background:#39506F;border-radius:999px;overflow:hidden}
.score .fill{height:100%;background:var(--soleil);border-radius:999px;transition:width .4s}

/* ---- fiches façon panneau d'affichage ---- */
main{max-width:760px;margin:0 auto;padding:14px}
.fiche{position:relative;background:var(--craie);border:2px solid var(--encre);border-radius:14px;
  box-shadow:5px 5px 0 rgba(35,50,74,.14);padding:14px;margin:18px 0}
.fiche>h2{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.fiche::before{content:"";position:absolute;top:-10px;left:24px;width:74px;height:18px;background:var(--scotch);
  transform:rotate(-2deg);border-radius:2px}
.note{font-size:13px;background:#FFF4D6;border:1px dashed var(--soleil);border-radius:10px;padding:8px 10px;margin:8px 0}

/* ---- pastilles jours ---- */
.jours{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;-webkit-overflow-scrolling:touch}
.jour{min-width:64px;min-height:56px;border:2px solid var(--encre);border-radius:12px;background:var(--craie);
  font-weight:700;font-size:13px;padding:6px 4px;text-align:center;flex-direction:column;display:flex;gap:2px;align-items:center;justify-content:center}
.jour small{font-weight:600;font-size:10px;opacity:.7}
.jour.actif{background:var(--soleil);box-shadow:3px 3px 0 rgba(35,50,74,.25)}
.jour .pt{font-size:10px;line-height:1}

/* ---- chips horaires ---- */
.ligne{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted #D8DCE5;font-size:14px}
.ligne:last-child{border-bottom:none}
.chip{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 7px;border-radius:8px;min-width:52px;text-align:center;transform:rotate(-1deg)}
.m-matin{background:var(--soleil);color:var(--encre)}
.m-aprem{background:var(--gave);color:var(--craie);transform:rotate(1deg)}
.m-soir{background:var(--encre);color:var(--craie)}
.pub{display:flex;align-items:center;gap:8px;width:100%;padding:10px 4px;font-weight:800;font-size:14px;min-height:44px}
.pub .n{margin-left:auto;font-size:12px;font-weight:600;opacity:.6}
.extra{display:inline-block;background:var(--braise);color:var(--craie);font-size:10px;font-weight:800;
  letter-spacing:.5px;padding:3px 8px;border-radius:999px;transform:rotate(-2deg)}

/* ---- météo ---- */
.meteo{display:flex;gap:8px;flex-wrap:wrap}
.meteo button{flex:1;min-width:72px;min-height:48px;border:2px solid var(--encre);border-radius:12px;background:var(--craie);font-size:12px;font-weight:700;padding:6px}
.meteo button.actif{background:var(--gave);color:var(--craie)}

/* ---- sorties ---- */
.cat-t{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#5A6A85;margin:18px 4px 6px}
.sortie{background:var(--craie);border:2px solid var(--encre);border-radius:14px;box-shadow:4px 4px 0 rgba(35,50,74,.12);padding:12px;margin:10px 0}
.sortie.fait{opacity:.62;background:#F2F6F1}
.s-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.s-nom{font-weight:800;font-size:15px}
.s-meta{font-size:12px;font-family:var(--mono);color:#4E5D77}
.s-pre{font-size:13px;margin:6px 0}
.s-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.s-act a,.s-act button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:12px;font-weight:700;font-size:13px;text-decoration:none}
.b-resa{background:var(--encre);color:var(--craie)}
.b-fait{border:2px solid var(--sapin);color:var(--sapin)}
.b-fait.on{background:var(--sapin);color:var(--craie)}
.b-want{border:2px solid var(--soleil);color:#8a6a00}
.b-want.on{background:var(--soleil);color:var(--encre)}
.s-open{display:block;width:100%;text-align:left;min-height:44px}
.s-hint{margin-left:auto;font-size:12px;font-weight:700;color:#5A6A85;white-space:nowrap}
.s-det{margin-top:10px;border-top:2px dashed #D8DCE5;padding-top:10px}
.s-photo{width:100%;height:150px;object-fit:cover;border:2px solid var(--encre);border-radius:10px;display:block;background:#DDE7EE}
.s-banner{height:110px;border:2px solid var(--encre);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:52px}
.bn-G{background:linear-gradient(160deg,#BFE3F0 55%,#8FBF9F 55%)}
.bn-E{background:linear-gradient(160deg,#FFE9B3 55%,#CDE7C5 55%)}
.bn-S{background:linear-gradient(160deg,#CDEDE8 55%,#F6D9A8 55%)}
.bn-O{background:linear-gradient(160deg,#BFE0EE 55%,#DFF2F5 55%)}
.bn-V{background:linear-gradient(160deg,#F3E3C8 55%,#E4D2EE 55%)}
.s-bloc{font-size:13px;margin:8px 0}
.s-bloc b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#5A6A85;margin-bottom:2px}
.pf{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pf span{background:#FFF4D6;border:1px solid var(--soleil);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600}
.b-iti{border:2px solid var(--gave);color:var(--gave)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease}
.confetti{position:fixed;font-size:26px;pointer-events:none;animation:vole 1s ease-out forwards;z-index:200}
@keyframes vole{to{transform:translateY(-90px) rotate(35deg);opacity:0}}

/* ---- missions ---- */
.mi{display:flex;gap:10px;align-items:center;min-height:48px;border-bottom:1px dotted #D8DCE5;font-size:14px}
.mi:last-child{border-bottom:none}
.mi button.cb{width:30px;height:30px;border:2px solid var(--encre);border-radius:9px;flex-shrink:0;font-size:16px;font-weight:800}
.mi.done{opacity:.55;text-decoration:line-through}
.mi.done button.cb{background:var(--sapin);border-color:var(--sapin);color:var(--craie)}
.aj{display:flex;gap:8px;margin-top:10px}
.aj input{flex:1;min-height:46px;border:2px solid var(--encre);border-radius:12px;padding:0 12px;font-size:14px;font-family:inherit;background:var(--craie)}
.aj button{min-height:46px;padding:0 16px;border-radius:12px;background:var(--soleil);font-weight:800}

/* ---- infos ---- */
.lien{display:flex;min-height:46px;align-items:center;font-size:14px;border-bottom:1px dotted #D8DCE5;color:var(--encre);text-decoration:none;font-weight:600;gap:8px}
.lien:last-child{border-bottom:none}
.danger{margin-top:12px;width:100%;min-height:48px;border:2px solid var(--braise);color:var(--braise);border-radius:12px;font-weight:800}

/* ---- barre d'onglets ---- */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--craie);border-top:2px solid var(--encre);z-index:60}
.n-in{max-width:760px;margin:0 auto;display:flex}
nav button{flex:1;min-height:64px;font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;color:#5A6A85}
nav button .ic{font-size:20px}
nav button.actif{color:var(--encre)}
nav button.actif .ic{transform:translateY(-2px)}
nav button.actif::after{content:"";width:26px;height:4px;border-radius:4px;background:var(--soleil)}
</style>

/* ================= ÉTAT PARTAGÉ ================= */
let ST = {state:{}, resetAt:0};
let vue = "jour";
let jourSel = defJour();
let enLigne = null;
let timerSync = null;
const ouverts = {};   // fiches sorties dépliées (local à l'appareil, non synchronisé)
const wikiImg = {};   // cache des photos Wikipédia
function chargePhoto(o){
  if(!o.w || wikiImg[o.id] !== undefined) return;
  wikiImg[o.id] = null;
  fetch("https://fr.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(o.w))
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      wikiImg[o.id] = (j && j.thumbnail && j.thumbnail.source) ? j.thumbnail.source : false;
      if(ouverts[o.id] && vue === "sorties") rendre();
    })
    .catch(function(){ wikiImg[o.id] = false; });
}

function defJour(){
  const d = new Date(); const iso = d.toISOString().slice(0,10);
  return DAYS.includes(iso) ? iso : DAYS[0];
}
function put(k,v){ ST.state[k] = {v:v, t:Date.now()}; rendre(); planifSync(); }
function val(k,def){ const e = ST.state[k]; return (e && (e.t||0) >= (ST.resetAt||0)) ? e.v : def; }
function fusion(remote){
  if(!remote || typeof remote !== "object") return;
  ST.resetAt = Math.max(ST.resetAt||0, remote.resetAt||0);
  const rs = remote.state || {};
  for(const k in rs){ const a = ST.state[k], b = rs[k];
    if(b && typeof b.t === "number" && (!a || b.t > a.t)) ST.state[k] = b; }
  for(const k in ST.state){ if((ST.state[k].t||0) < ST.resetAt) delete ST.state[k]; }
}
async function sync(){
  try{
    const r = await fetch(API + "?trip=" + encodeURIComponent(TRIP), {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(ST)});
    if(!r.ok) throw new Error(r.status);
    fusion(await r.json()); enLigne = true;
  }catch(e){ enLigne = false; }
  majSync(); rendre();
}
function planifSync(){ clearTimeout(timerSync); timerSync = setTimeout(sync, 800); }
setInterval(function(){ if(document.visibilityState === "visible") sync(); }, 15000);
function majSync(){
  const b = document.getElementById("sync");
  if(enLigne === true){ b.textContent = "✓ partagé"; b.className = "badge-sync ok"; }
  else if(enLigne === false){ b.textContent = "hors ligne"; b.className = "badge-sync off"; b.title = "Coches gardées sur cet appareil — sync dès que /api/sync répond"; }
}

/* ================= SCORE ================= */
function score(){
  let s = 0;
  SORTIES.forEach(function(o){ if(val("done:"+o.id,false)) s += 10; });
  MISSIONS.forEach(function(_,i){ if(val("md:"+i,false)) s += 2; });
  (val("cm",[])).forEach(function(m){ if(m.done) s += 2; });
  return s;
}
function majScore(){
  const s = score();
  const niveaux = [[0,"🐹 Marmotte"],[30,"🐐 Isard"],[80,"🦅 Vautour"],[150,"🐻 Ours des Pyrénées"]];
  let n = niveaux[0], max = 160;
  niveaux.forEach(function(x){ if(s >= x[0]) n = x; });
  document.getElementById("niveau").textContent = n[1];
  document.getElementById("scoretxt").textContent = s + " pt";
  document.getElementById("scorefill").style.width = Math.min(100, Math.round(s/max*100)) + "%";
}

/* ================= RENDUS ================= */
const esc = function(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;"); };
function chip(h){
  const H = parseInt(h,10);
  const cl = H < 13 ? "m-matin" : (H < 19 ? "m-aprem" : "m-soir");
  return '<span class="chip ' + cl + '">' + h + '</span>';
}
function lignes(arr){
  if(!arr.length) return '<div class="ligne" style="opacity:.55">— rien d\'affiché —</div>';
  return arr.map(function(a){
    const fl = a[2]||"";
    let extra = "";
    if(fl.indexOf("*")>-1) extra += " ⭐";
    if(fl.indexOf("F")>-1) extra += ' <b style="color:var(--braise)">EN FAMILLE</b>';
    if(fl.indexOf("I")>-1) extra += ' <b style="color:var(--gave)">SUR INSCRIPTION</b>';
    return '<div class="ligne">' + chip(a[0]) + '<div>' + esc(a[1]) + extra + '</div></div>';
  }).join("");
}
function vueJour(){
  const d = new Date(jourSel + "T12:00:00");
  const pills = DAYS.map(function(iso){
    const dd = new Date(iso + "T12:00:00");
    const met = val("met:"+iso,"");
    return '<button class="jour' + (iso===jourSel?" actif":"") + '" data-act="jour" data-v="' + iso + '">' +
      '<small>' + JSEM[dd.getDay()] + '</small>' + dd.getDate() +
      '<span class="pt">' + (met ? METEO[met].ic : "&nbsp;") + '</span></button>';
  }).join("");
  const met = val("met:"+jourSel,"");
  const meteoBtns = Object.keys(METEO).map(function(k){
    return '<button data-act="met" data-v="' + k + '" class="' + (met===k?"actif":"") + '">' + METEO[k].ic + "<br>" + METEO[k].t + '</button>';
  }).join("");
  let plan = "";
  if(met){
    const M = METEO[met];
    plan = '<div class="note">💡 ' + M.tip + '</div>' + M.ids.map(function(id){
      const o = SORTIES.find(function(x){return x.id===id;});
      return '<div class="ligne"><span class="chip m-matin" style="min-width:auto">' + o.e + '</span><div><b>' + esc(o.n) + '</b> · ' + o.r + ' · ' + esc(o.p) + '</div></div>';
    }).join("");
  } else {
    plan = '<div class="note">Choisis la météo du jour ci-dessus → le QG propose le bon plan (partagé avec toute la famille).</div>';
  }
  const camp = CAMP[jourSel];
  let bloc;
  if(camp){
    bloc = ["e","a","x"].map(function(g,i){
      const noms = ["🧒 Enfants 5-12 ans","🎧 Ados","🍹 Adultes"];
      const open = val("acc:"+g, g==="e");
      return '<button class="pub" data-act="acc" data-v="' + g + '">' + noms[i] +
        '<span class="n">' + camp[g].length + ' activité' + (camp[g].length>1?"s":"") + ' ' + (open?"▾":"▸") + '</span></button>' +
        (open ? lignes(camp[g]) : "");
    }).join("");
  } else {
    bloc = '<div class="note">📸 Programme de la semaine 2 pas encore affiché — photographie le panneau samedi et envoie-le à Claude pour mettre le QG à jour.</div>';
  }
  const note = NOTES[jourSel] ? '<div class="note">' + NOTES[jourSel] + '</div>' : "";
  return '<div class="jours">' + pills + '</div>' + note +
    '<section class="fiche"><h2>Aujourd\'hui on fait quoi ? <span style="text-transform:none;font-weight:600;font-size:12px">(' + JSEM[d.getDay()] + " " + d.getDate() + ')</span></h2>' +
    '<div class="meteo">' + meteoBtns + '</div>' + plan + '</section>' +
    '<section class="fiche"><h2>🏕️ Animations camping <span class="extra">toujours en extra ✨</span></h2>' + bloc +
    '<div class="note" style="margin-top:10px">Rappels : rien pour personne entre 12h30 et 16h (piscine !) · présence à l\'heure de début exigée · l\'appli Yelloh! fait foi.</div></section>';
}
function vueSorties(){
  const faits = SORTIES.filter(function(o){return val("done:"+o.id,false);}).length;
  let html = '<section class="fiche"><h2>Compteur d’aventures</h2><div class="note">✅ ' + faits + ' / ' + SORTIES.length +
    ' — 10 points par sortie faite. Touche une fiche pour ouvrir le détail : photo, accès, itinéraire, horaires, points forts.</div></section>';
  Object.keys(CATS).forEach(function(c){
    html += '<div class="cat-t">' + CATS[c] + '</div>';
    SORTIES.filter(function(o){return o.c===c;}).forEach(function(o){ html += carteSortie(o); });
  });
  return html;
}
function carteSortie(o){
  const done = val("done:"+o.id,false), want = val("want:"+o.id,false), open = !!ouverts[o.id];
  let det = "";
  if(open){
    const img = wikiImg[o.id];
    const visuel = (typeof img === "string")
      ? '<img class="s-photo" loading="lazy" alt="' + esc(o.n) + '" src="' + img + '">'
      : '<div class="s-banner bn-' + o.c + '">' + o.e + '</div>';
    const pfs = o.pf.map(function(pt){ return '<span>' + esc(pt) + '</span>'; }).join("");
    det = '<div class="s-det">' + visuel +
      '<div class="s-bloc">' + esc(o.ds) + '</div>' +
      '<div class="s-bloc"><b>🚗 Accès</b>' + esc(o.acc) + '</div>' +
      '<div class="s-bloc"><b>🕘 Horaires</b>' + esc(o.ho) + '</div>' +
      '<div class="s-bloc"><b>⏱ Durée idéale famille</b>' + esc(o.di) + '</div>' +
      '<div class="s-bloc"><b>✨ Points forts</b><div class="pf">' + pfs + '</div></div>' +
      ((typeof img === "string") ? '<div style="font-size:10px;color:#8A96AB;margin-top:4px">Photo : Wikimédia, chargée en ligne</div>' : "") +
      '</div>';
  }
  return '<article class="sortie' + (done?" fait":"") + '">' +
    '<button class="s-open" data-act="det" data-v="' + o.id + '">' +
      '<div class="s-top"><span>' + o.e + '</span><span class="s-nom">' + esc(o.n) + (o.s?" ⭐":"") + '</span>' +
      '<span class="s-hint">' + (open?"replier ▴":"détails ▾") + '</span></div>' +
      '<div class="s-meta">🚗 ' + o.r + ' · ⏱ ' + o.d + ' · 💶 ' + esc(o.p) + '</div></button>' +
    det +
    '<div class="s-pre">📌 ' + esc(o.pre) + '</div>' +
    '<div class="s-act">' +
    (o.gm ? '<a class="b-iti" href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(o.gm) + '" target="_blank" rel="noopener">🧭 Itinéraire</a>' : "") +
    (o.u ? '<a class="b-resa" href="' + o.u + '" target="_blank" rel="noopener">Réserver / infos</a>' : "") +
    '<button class="b-want' + (want?" on":"") + '" data-act="want" data-v="' + o.id + '">' + (want?"⭐ Au programme":"☆ On y va ?") + '</button>' +
    '<button class="b-fait' + (done?" on":"") + '" data-act="done" data-v="' + o.id + '">' + (done?"✓ Fait !":"C’est fait ?") + '</button>' +
    '</div></article>';
}
function vueMissions(){
  const cm = val("cm",[]);
  let li = MISSIONS.map(function(m,i){
    const done = val("md:"+i,false);
    return '<div class="mi' + (done?" done":"") + '"><button class="cb" data-act="md" data-v="' + i + '">' + (done?"✓":"") + '</button><span>' + esc(m) + '</span></div>';
  }).join("");
  li += cm.map(function(m){
    return '<div class="mi' + (m.done?" done":"") + '"><button class="cb" data-act="cm" data-v="' + m.id + '">' + (m.done?"✓":"") + '</button><span>' + esc(m.txt) + '</span></div>';
  }).join("");
  return '<section class="fiche"><h2>✅ Missions de la famille</h2>' + li +
    '<div class="aj"><input id="nm" maxlength="90" placeholder="Ajouter une mission…"><button data-act="add">+</button></div>' +
    '<div class="note" style="margin-top:10px">2 points par mission accomplie — cochée sur un téléphone, cochée pour tous.</div></section>';
}
function vueInfos(){
  const L = [
    ["🚌","Navette estivale + bus LIO 965 → Gavarnie & Pont d'Espagne (horaires à l'accueil)",""],
    ["🌦️","Météo-France Argelès-Gazost","https://meteofrance.com/previsions-meteo-france/argeles-gazost/65400"],
    ["⚠️","Vigilance Hautes-Pyrénées","https://vigilance.meteofrance.fr/fr/hautes-pyrenees"],
    ["📷","Webcams du Pic du Midi (go / no-go du matin)","https://picdumidi.com/"],
    ["🎟️","Billetterie Pic du Midi (J-3 = -25 %)","https://picdumidi.com/fr/billetterie/"],
    ["⛵","Réserver Bétharram","https://www.betharram.com/page/tarifs-horaires"],
    ["🚂","Réserver Artouste","https://artouste.fr/ete/le-train-dartouste/les-tarifs/"],
    ["🦫","Billets Parc animalier","https://www.parc-animalier-pyrenees.com/page/horaires-et-tarifs"],
    ["🏕️","Appli & animations Les 3 Vallées","https://www.camping3vallees.com/activites-et-animations"]
  ];
  const li = L.map(function(x){
    return x[2] ? '<a class="lien" href="' + x[2] + '" target="_blank" rel="noopener">' + x[0] + " " + esc(x[1]) + '</a>'
                : '<div class="lien">' + x[0] + " " + esc(x[1]) + '</div>';
  }).join("");
  return '<section class="fiche"><h2>ℹ️ Liens & réflexes</h2>' + li + '</section>' +
    '<section class="fiche"><h2>Règles d\'or</h2>' +
    '<div class="ligne">🕘 Grosses sorties : départ avant 9h (parkings + orages d\'après-midi).</div>' +
    '<div class="ligne">🏊 12h30-16h : créneau libre pour tous → piscine, sieste, départ différé.</div>' +
    '<div class="ligne">🎭 Retour 17h30-18h les jours d\'excursion → activités famille + soirée.</div>' +
    '<div class="ligne">🧥 Une polaire chacun, même par 30 °C en vallée.</div>' +
    '<div class="ligne">💶 À 5 ans, le petit paie tarif enfant presque partout (gratuités < 4-5 ans).</div>' +
    '<button class="danger" data-act="raz">Tout remettre à zéro (appuyer 2×)</button>' +
    '<div class="note" style="margin-top:10px">Données du 26/07/2026 · prix susceptibles d\'évoluer · [à vérifier] = non confirmé en ligne.</div></section>';
}
let razArme = 0;
function rendre(){
  const app = document.getElementById("app");
  app.innerHTML = vue==="jour" ? vueJour() : vue==="sorties" ? vueSorties() : vue==="missions" ? vueMissions() : vueInfos();
  majScore();
}

/* ================= INTERACTIONS ================= */
document.addEventListener("click", function(ev){
  const nb = ev.target.closest("nav button");
  if(nb){ vue = nb.dataset.vue;
    document.querySelectorAll("nav button").forEach(function(b){ b.classList.toggle("actif", b===nb); });
    rendre(); return; }
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a==="jour"){ jourSel = v; rendre(); }
  else if(a==="met"){ put("met:"+jourSel, val("met:"+jourSel,"")===v ? "" : v); }
  else if(a==="acc"){ put("acc:"+v, !val("acc:"+v, v==="e")); }
  else if(a==="done"){ const nv = !val("done:"+v,false); put("done:"+v, nv); if(nv) confetti(ev); }
  else if(a==="want"){ put("want:"+v, !val("want:"+v,false)); }
  else if(a==="det"){ ouverts[v] = !ouverts[v];
    if(ouverts[v]){ const o = SORTIES.find(function(x){return x.id===v;}); if(o) chargePhoto(o); }
    rendre(); }
  else if(a==="md"){ put("md:"+v, !val("md:"+v,false)); }
  else if(a==="cm"){ const cm = val("cm",[]).map(function(m){ return m.id===v ? {id:m.id,txt:m.txt,done:!m.done} : m; }); put("cm", cm); }
  else if(a==="add"){ const inp = document.getElementById("nm"); const t = (inp.value||"").trim();
    if(t){ const cm = val("cm",[]).concat([{id:"c"+Date.now(),txt:t,done:false}]); put("cm", cm); } }
  else if(a==="raz"){
    const now = Date.now();
    if(now - razArme < 4000){ ST = {state:{}, resetAt:now}; razArme = 0; rendre(); planifSync(); }
    else { razArme = now; el.textContent = "Sûr ? Réappuyer pour confirmer"; setTimeout(function(){ el.textContent = "Tout remettre à zéro (appuyer 2×)"; }, 4000); }
  }
});
function confetti(ev){
  ["🎉","⛰️","☀️"].forEach(function(c,i){
    const s = document.createElement("span");
    s.className = "confetti"; s.textContent = c;
    s.style.left = (ev.clientX - 10 + i*18) + "px"; s.style.top = (ev.clientY - 10) + "px";
    document.body.appendChild(s); setTimeout(function(){ s.remove(); }, 1000);
  });
}

/* ================= DÉMARRAGE ================= */
rendre();
sync();
</script>
</body>
</html>
