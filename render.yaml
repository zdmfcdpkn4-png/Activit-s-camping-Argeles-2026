# Blueprint Render — New + > Blueprint > sélectionner ce dépôt.
# Les deux variables Upstash sont à renseigner à la main (sync: false).
services:
  - type: web
    name: qg-sejour-argeles
    runtime: node
    plan: free
    buildCommand: "echo aucune-dependance"
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
