# Blueprint Render — New + > Blueprint > sélectionner ce dépôt.
# DATABASE_URL est à renseigner à la main (sync: false) : URL de la base
# PostgreSQL Render (Internal Database URL de préférence, même région que le service).
services:
  - type: web
    name: qg-sejour-argeles
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
